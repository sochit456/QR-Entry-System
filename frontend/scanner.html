<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b6fb8">
    <title>Scanner · Entry Desk</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script>(function(){try{var t=localStorage.getItem("theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}})()</script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/html5-qrcode" defer></script>
</head>
<body data-page="scanner" class="protected-page">
    <div id="loginOverlay" class="auth-overlay" style="display: none;">
        <div class="auth-card">
            <img src="/static/logo.png" alt="">
            <h2>Unlock the entry desk</h2>
            <p>Enter the staff password to continue.</p>
            <form id="authForm" class="auth-form">
                <label class="field">Password
                    <input id="authPassword" type="password" autocomplete="current-password" enterkeyhint="go" required>
                </label>
                <button type="submit" class="btn btn--primary btn--block">Unlock</button>
                <div id="authError" class="auth-error" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <div id="mainContent" class="protected-content" aria-hidden="true" style="display: none;">
        <header class="app-bar">
            <div class="app-bar-inner">
                <a class="brand" href="/"><img src="/static/logo.png" alt=""><span class="brand-name">Entry Desk</span></a>
                <nav class="app-nav" aria-label="Main"><a href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a><a href="/register"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-3A3.5 3.5 0 0 0 5 17.5V19"/><circle cx="10" cy="8" r="3.2"/><path d="M19 8v5M16.5 10.5h5"/></svg><span>Register</span></a><a href="/scanner" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M4 12h16"/></svg><span>Scanner</span></a><a href="/admin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Dashboard</span></a><a href="/settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></a></nav>
            </div>
        </header>
        <div class="page">
            <div class="page-head"><div>
                <h1>Scan entry passes</h1>
                <p>Point the camera at a QR pass. Each pass works once.</p>
            </div></div>
            <div class="scanner-stage">
                <section class="scanner-panel">
                    <div class="scanner-top">
                        <span id="cameraPill" class="live-pill is-off">Starting camera</span>
                        <button id="switchCameraButton" type="button" class="btn btn--sm">Switch camera</button>
                    </div>
                    <div id="scannerViewport" class="scanner-viewport"></div>
                    <div id="scannerHint" class="inline-meta">Allow camera access to begin scanning.</div>
                </section>
                <section id="scanStatus" class="scan-status neutral" aria-live="assertive">
                    <div class="scan-icon"><svg class="i-ready" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/></svg><svg class="i-valid" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg><svg class="i-used" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 7.5V12l3 2"/></svg><svg class="i-invalid" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></div>
                    <h3 id="scanTitle">Ready to scan</h3>
                    <p id="scanMessage">The result of each scan shows here.</p>
                </section>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
