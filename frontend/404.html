<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b6fb8">
    <title>Page not found · Entry Desk</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script>(function(){try{var t=localStorage.getItem("theme")||"system";if(t==="system")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t}catch(e){}})()</script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="notfound">
    <main class="nf-wrap">
        <article class="ticket nf-ticket" aria-labelledby="nfTitle">
            <div class="ticket-head">
                <img src="/static/logo.png" alt="">
                <div><strong>Entry Desk</strong><span></span></div>
            </div>
            <div class="nf-body">
                <div class="nf-code" aria-hidden="true">404</div>
                <h1 id="nfTitle">This page doesn't exist</h1>
                <p>The link may be old or mistyped. Pick where you want to go instead.</p>
            </div>
            <div class="ticket-tear"></div>
            <div class="ticket-foot nf-links">
                <a class="btn btn--primary btn--block" href="/">Register a guest</a>
                <a class="btn btn--block" href="/scanner">Open scanner</a>
                <a class="btn btn--block" href="/admin">View dashboard</a>
            </div>
        </article>
    </main>
    <script src="/static/script.js"></script>
</body>
</html>
