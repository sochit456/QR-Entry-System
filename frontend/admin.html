<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b6fb8">
    <title>Dashboard · Entry Desk</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <script>
(function () {
    var config = null;
    try {
        config = JSON.parse(localStorage.getItem("entryDeskPublicConfig") || "null");
        var savedTheme = (config && config.theme) || localStorage.getItem("theme") || "system";
        if (savedTheme === "system") {
            savedTheme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (savedTheme === "dark" || savedTheme === "light") {
            document.documentElement.dataset.theme = savedTheme;
        }
        if (config && /^#[0-9a-f]{6}$/i.test(config.brand_color || "")) {
            document.documentElement.style.setProperty("--brand", config.brand_color);
        }
    } catch (e) {
        /* Keep the CSS default if browser storage is unavailable. */
    }

    /* Cached public settings are applied before the first page paint where possible. */
    document.addEventListener("DOMContentLoaded", function () {
        if (!config) return;
        try {
            var eventName = config.event_name || "Entry Desk";
            document.querySelectorAll(".brand-name").forEach(function (node) {
                node.textContent = eventName;
            });
            document.querySelectorAll(".ticket-head strong").forEach(function (node) {
                node.textContent = eventName || "Event";
            });
            document.querySelectorAll(".ticket-head span").forEach(function (node) {
                node.textContent = config.organization_name || "";
            });
            if (config.logo_url) {
                document.querySelectorAll(".brand img, .ticket-head img, .auth-card > img").forEach(function (img) {
                    img.src = config.logo_url;
                });
            }
            var page = document.body.dataset.page;
            if (page === "registration") {
                var heading = document.querySelector(".page-head h1");
                var description = document.querySelector(".page-head p");
                if (heading) heading.textContent = eventName || "Register a participant";
                if (description) description.textContent = config.event_description || "Register to receive a QR entry pass.";
            } else if (page === "scanner") {
                var scanHeading = document.querySelector(".page-head h1");
                var scanDescription = document.querySelector(".page-head p");
                if (scanHeading) scanHeading.textContent = "Scan entry passes";
                if (scanDescription) scanDescription.textContent = "Checking in guests for " + eventName + ". Each pass works once.";
            }
            var titlePrefix = page === "settings" ? "Settings" : page === "scanner" ? "Scanner" : page === "admin" ? "Dashboard" : page === "registration" ? "Register" : page === "notfound" ? "Page not found" : "Home";
            document.title = titlePrefix + " · " + eventName;
        } catch (e) {
            /* The fresh public config will still be applied by script.js. */
        }
    });
})();
</script>
    <link rel="stylesheet" href="/static/style.css?v=20261016-1">
</head>
<body data-page="admin" class="protected-page">
    <div id="loginOverlay" class="auth-overlay" style="display: none;">
        <div class="auth-card">
            <img src="/static/logo.png" alt="">
            <h2>Unlock the entry desk</h2>
            <p>Enter the staff password to continue.</p>
            <form id="authForm" class="auth-form">
                <label class="field">Password
                    <input id="authPassword" type="password" autocomplete="current-password" enterkeyhint="go" required>
                </label>
                <button type="submit" class="btn btn--primary btn--block">Unlock</button>
                <div id="authError" class="auth-error" aria-live="polite"></div>
            </form>
        </div>
    </div>

    <div id="mainContent" class="protected-content" aria-hidden="true" style="display: none;">
        <header class="app-bar">
            <div class="app-bar-inner">
                <a class="brand" href="/"><img src="/static/logo.png" alt=""><span class="brand-name">Entry Desk</span></a>
                <nav class="app-nav" aria-label="Main"><a href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a><a href="/register"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-3A3.5 3.5 0 0 0 5 17.5V19"/><circle cx="10" cy="8" r="3.2"/><path d="M19 8v5M16.5 10.5h5"/></svg><span>Register</span></a><a href="/scanner"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M4 12h16"/></svg><span>Scanner</span></a><a href="/admin" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Dashboard</span></a><a href="/settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span>Settings</span></a></nav>
            </div>
        </header>
        <div class="page">
            <div class="page-head">
                <div>
                    <h1>Dashboard</h1>
                    <p>Watch entries as they happen and manage the guest list.</p>
                </div>
                <div class="page-actions">
                    <input id="importCsvInput" type="file" accept=".csv" style="display: none;">
                    <button id="importCsvButton" type="button" class="btn">Import CSV</button>
                    <button id="downloadCsvButton" type="button" class="btn">Download CSV</button>
                    <button id="refreshStudents" type="button" class="btn">Refresh</button>
                </div>
            </div>

            <section class="summary" aria-label="Entry summary">
                <div class="summary-grid">
                    <div class="summary-item"><span>Registered</span><strong id="statTotal">0</strong></div>
                    <div class="summary-item"><span>Entered</span><strong id="statUsed">0</strong></div>
                    <div class="summary-item"><span>Yet to enter</span><strong id="statRemaining">0</strong></div>
                </div>
                <div class="summary-bar">
                    <div><span>Attendance</span><span id="statPercent">0%</span></div>
                    <div class="bar-track"><div id="statProgress" class="bar-fill"></div></div>
                </div>
            </section>

            <div class="toolbar">
                <input id="searchRoll" type="search" placeholder="Search by unique field" aria-label="Search guests">
                <div class="segmented" role="group" aria-label="Filter by status">
                    <button type="button" class="filter-chip active" data-filter="all">All</button>
                    <button type="button" class="filter-chip" data-filter="used">Entered</button>
                    <button type="button" class="filter-chip" data-filter="not-used">Not entered</button>
                </div>
            </div>
            <div id="adminMessage" class="inline-message" aria-live="polite"></div>

            <section class="table-panel">
                <div class="table-wrap">
                    <table>
                        <thead><tr id="studentsTableHead">
                            <th>Name</th><th>Status</th><th>QR</th><th>Registered</th><th>Entered</th><th>Actions</th>
                        </tr></thead>
                        <tbody id="studentsTableBody">
                            <tr><td colspan="6" class="empty-state">Loading guest list…</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="/static/script.js?v=20261016-1"></script>
</body>
</html>
